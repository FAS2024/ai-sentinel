services:
  postgres:
    image: postgres:16
    container_name: ai_sentinel_postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: ai_sentinel
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai_sentinel_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
