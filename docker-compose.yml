services:
  postgres:
    image: postgres:16
    container_name: ai_sentinel_postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: ai_sentinel
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d ai_sentinel"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ai_sentinel_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: ai_sentinel_api
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:sentinel@postgres:5432/ai_sentinel
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
