[project]
name = "ai-sentinel"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI uses Depends() in parameter defaults by design.
[tool.ruff.lint.per-file-ignores]
"backend/fastapi_app/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
